<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagere Bingo Lobby</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161f32;
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --gold: #f59e0b;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--gold);
            font-size: 1.6rem;
            margin: 0 0 4px 0;
        }
        .header p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin: 0;
        }
        .stat-banner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-title { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; }
        .stat-val { font-size: 1.15rem; font-weight: 800; margin-top: 4px; }

        .ticket-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .ticket-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn-step {
            background: #243049;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }
        .ticket-count {
            flex: 1;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 0;
            color: var(--gold);
        }
        .btn-buy {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Hagere Bingo Live</h1>
        <p>Pick your tickets and join the upcoming draw!</p>
    </div>

    <div class="stat-banner">
        <div class="stat-box">
            <div class="stat-title">Active Round</div>
            <div class="stat-val" id="lobby-round" style="color: var(--accent);">#1025</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Total Prize Pool</div>
            <div class="stat-val" style="color: var(--success);" id="lobby-pool">1,500 ETB</div>
        </div>
    </div>

    <div class="ticket-section">
        <div class="section-title">🎫 Purchase Bingo Tickets (1 - 200)</div>
        <div class="ticket-input-group">
            <button class="btn-step" onclick="adjustTickets(-1)">-</button>
            <div class="ticket-count" id="ticket-val">1</div>
            <button class="btn-step" onclick="adjustTickets(1)">+</button>
        </div>
        <button class="btn-buy" onclick="buyTickets()">
            Confirm Purchase (<span id="total-price">10</span> ETB)
        </button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let count = 1;
        const pricePerTicket = 10;

        function adjustTickets(delta) {
            count = Math.max(1, Math.min(200, count + delta));
            document.getElementById('ticket-val').innerText = count;
            document.getElementById('total-price').innerText = count * pricePerTicket;
        }

        async function buyTickets() {
            const totalPrice = count * pricePerTicket;
            if (confirm(`Confirm purchase of ${count} ticket(s) for ${totalPrice} ETB?`)) {
                try {
                    const response = await fetch('/api/buy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ count: count })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        alert(data.message);
                        document.getElementById('lobby-pool').innerText = data.new_prize_pool.toLocaleString() + " ETB";
                    } else {
                        alert(data.message);
                    }
                } catch (e) {
                    alert("Transaction failed. Please try again.");
                }
            }
        }

        async function syncLobby() {
            try {
                const res = await fetch('/api/admin/stats');
                const data = await res.json();
                document.getElementById('lobby-round').innerText = "#" + data.active_game_id;
                document.getElementById('lobby-pool').innerText = data.prize_pool.toLocaleString() + " ETB";
            } catch (e) {}
        }
        syncLobby();
    </script>
</body>
</html>
