<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hagere Bingo Live</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161f32;
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #38bdf8;
            --cell-bg: #1e293b;
            --cell-marked: #22c55e;
            --gold-glow: #f59e0b;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Header Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-bottom: 12px;
        }

        .balance-title {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .balance-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #22c55e;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-deposit { background: linear-gradient(135deg, #16a34a, #22c55e); color: #000; border: none; }
        .btn-withdraw { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #000; border: none; }

        /* Game & Lobby Live Stats Panel */
        .live-stats-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--accent-glow);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .stat-item .label {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .stat-item .value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        /* 1 to 200 Ticket Selection Grid */
        .lobby-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
        }

        .lobby-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--gold-glow);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .ticket-card {
            background: var(--cell-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .ticket-card .num {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .ticket-card .status {
            font-size: 0.6rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* Ticket States */
        .ticket-card.available {
            border-color: rgba(56, 189, 248, 0.3);
        }
        .ticket-card.available:hover {
            border-color: var(--accent-glow);
            transform: scale(1.05);
        }

        .ticket-card.taken {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger-color);
            color: var(--danger-color);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .ticket-card.selected {
            background: linear-gradient(135deg, #15803d, #22c55e);
            color: #fff;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        /* Active Game View (Hidden until ticket chosen) */
        .game-view {
            display: none;
        }

        /* Modal Overlays */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 18px;
            width: 85%;
            max-width: 360px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--bg-main);
            color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="balance-title">Balance</div>
            <div class="balance-value" id="user-balance">0.00 <span style="font-size:0.8rem;">ETB</span></div>
        </div>
        <button class="btn-action" style="padding: 6px 12px;" onclick="fetchBalance()">🔄</button>
    </div>

    <div class="action-row">
        <button class="btn-action btn-deposit" onclick="openModal('deposit-modal')">📥 Deposit</button>
        <button class="btn-action btn-withdraw" onclick="openModal('withdraw-modal')">📤 Withdraw</button>
    </div>

    <div class="live-stats-card">
        <div class="stat-item">
            <div class="label">Active Game</div>
            <div class="value" style="color: var(--accent-glow);" id="stat-game-id">#1024</div>
        </div>
        <div class="stat-item">
            <div class="label">Players</div>
            <div class="value" style="color: var(--gold-glow);" id="stat-players-count">18 / 200</div>
        </div>
        <div class="stat-item">
            <div class="label">Prize Pool</div>
            <div class="value" style="color: #22c55e;" id="stat-prize-pool">450 ETB</div>
        </div>
    </div>

    <div id="lobby-view" class="lobby-panel">
        <div class="lobby-title">
            <span>🎟️ Select Ticket (1 - 200)</span>
            <span style="font-size:0.75rem; color:var(--text-sub);">Stake: 25 ETB</span>
        </div>
        <div class="ticket-grid" id="ticket-container">
            </div>
    </div>

    <div id="deposit-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">📥 Deposit Funds</h3>
            <select id="deposit-method">
                <option value="telebirr">Telebirr</option>
                <option value="cbe">CBE Birr / CBE Bank</option>
            </select>
            <input type="number" id="deposit-amount" placeholder="Amount (ETB)">
            <input type="text" id="deposit-ref" placeholder="TX Ref Code">
            <button class="btn-action btn-deposit" style="width:100%;" onclick="submitDeposit()">Submit Deposit</button>
            <button class="btn-action" style="width:100%; margin-top:8px; border:none;" onclick="closeModal('deposit-modal')">Cancel</button>
        </div>
    </div>

    <div id="withdraw-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">📤 Request Cashout</h3>
            <select id="withdraw-method">
                <option value="telebirr">Telebirr Account</option>
                <option value="cbe">CBE Bank Account</option>
            </select>
            <input type="text" id="withdraw-acc" placeholder="Account / Phone Number">
            <input type="number" id="withdraw-amount" placeholder="Amount (ETB)">
            <button class="btn-action btn-withdraw" style="width:100%;" onclick="submitWithdraw()">Submit Request</button>
            <button class="btn-action" style="width:100%; margin-top:8px; border:none;" onclick="closeModal('withdraw-modal')">Cancel</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Simulated list of taken tickets (Replace with real websocket or backend API)
        const takenTickets = [3, 7, 12, 19, 25, 42, 58, 77, 88, 105, 119, 140, 166, 189];

        function renderTickets() {
            const container = document.getElementById('ticket-container');
            container.innerHTML = '';

            for (let i = 1; i <= 200; i++) {
                const isTaken = takenTickets.includes(i);
                const ticket = document.createElement('div');
                ticket.className = `ticket-card ${isTaken ? 'taken' : 'available'}`;
                
                ticket.innerHTML = `
                    <div class="num">#${i}</div>
                    <div class="status">${isTaken ? 'TAKEN' : 'OPEN'}</div>
                `;

                if (!isTaken) {
                    ticket.onclick = () => selectTicket(i, ticket);
                }

                container.appendChild(ticket);
            }
        }

        function selectTicket(ticketNum, element) {
            if(tg) tg.HapticFeedback.impactOccurred('medium');

            document.querySelectorAll('.ticket-card').forEach(t => t.classList.remove('selected'));
            element.classList.add('selected');

            setTimeout(() => {
                if(confirm(`Confirm purchase for Ticket #${ticketNum} (25 ETB)?`)) {
                    alert(`Ticket #${ticketNum} registered! Joining active game...`);
                    // Here you transition to the live game board view
                }
            }, 100);
        }

        renderTickets();
    </script>
</body>
</html>
