<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagere Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --success-green: #22c55e;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .balance-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--success-green);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-deposit { background: var(--success-green); color: #000; }
        .btn-withdraw { background: var(--accent-blue); color: #000; }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            width: 85%;
            max-width: 360px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            background: var(--accent-blue);
            color: #000;
            cursor: pointer;
        }

        .btn-close {
            background: transparent;
            color: var(--text-dim);
            border: none;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div style="font-size: 0.8rem; color: var(--text-dim);">Player Balance</div>
            <div class="balance-box" id="user-balance">0.00 ETB</div>
        </div>
        <button style="background:none; border:none; color:var(--text-dim);" onclick="fetchBalance()">🔄</button>
    </div>

    <!-- Deposit & Withdraw Quick Buttons -->
    <div class="action-grid">
        <button class="btn-action btn-deposit" onclick="openModal('deposit-modal')">➕ Deposit</button>
        <button class="btn-action btn-withdraw" onclick="openModal('withdraw-modal')">➖ Withdraw</button>
    </div>

    <!-- Main Game Section Placeholder -->
    <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center;">
        <h3 style="margin-top:0;">🎮 Bingo Game Board</h3>
        <p style="color: var(--text-dim); font-size:0.9rem;">Select your numbers and join active round.</p>
    </div>

    <!-- Deposit Modal -->
    <div id="deposit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">📥 Deposit Funds</div>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 12px;">
                Send ETB via Telebirr or CBE, then enter your transaction reference number below:
            </p>
            <select id="deposit-method">
                <option value="telebirr">Telebirr</option>
                <option value="cbe">CBE Birr / CBE Bank</option>
            </select>
            <input type="number" id="deposit-amount" placeholder="Amount (ETB)">
            <input type="text" id="deposit-ref" placeholder="Transaction Ref (e.g. PIT123456)">
            <button class="btn-submit" onclick="submitDeposit()">Submit Deposit</button>
            <button class="btn-close" onclick="closeModal('deposit-modal')">Cancel</button>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdraw-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">📤 Request Cashout</div>
            <select id="withdraw-method">
                <option value="telebirr">Telebirr Account</option>
                <option value="cbe">CBE Account</option>
            </select>
            <input type="text" id="withdraw-acc" placeholder="Account / Phone Number">
            <input type="number" id="withdraw-amount" placeholder="Amount (ETB)">
            <button class="btn-submit" onclick="submitWithdraw()">Submit Request</button>
            <button class="btn-close" onclick="closeModal('withdraw-modal')">Cancel</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitDeposit() {
            const amount = document.getElementById('deposit-amount').value;
            const ref = document.getElementById('deposit-ref').value;
            const method = document.getElementById('deposit-method').value;

            if(!amount || !ref) {
                alert('Please enter amount and reference code.');
                return;
            }

            alert(`Deposit request submitted! Admin will verify transaction reference: ${ref}`);
            closeModal('deposit-modal');
        }

        async function submitWithdraw() {
            const amount = document.getElementById('withdraw-amount').value;
            const acc = document.getElementById('withdraw-acc').value;

            if(!amount || !acc) {
                alert('Please enter account number and amount.');
                return;
            }

            alert(`Cashout request for ${amount} ETB to ${acc} submitted successfully!`);
            closeModal('withdraw-modal');
        }
    </script>
</body>
</html>
