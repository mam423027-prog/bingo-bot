<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagere Bingo - Admin Control Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent-color);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-title {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 4px;
            color: #fff;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-sub);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Data Tables / Action Lists */
        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-success { background: var(--success-color); color: #fff; }
        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-accent { background: var(--accent-color); color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 Admin Control Center</h1>
        <span style="font-size: 0.8rem; color: var(--text-sub);">HagereBingo Live</span>
    </div>

    <!-- KPI Stats Overview -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">Total Players</div>
            <div class="stat-value" id="stat-users">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Total Deposits</div>
            <div class="stat-value" id="stat-deposits">-- ETB</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Pending Cashouts</div>
            <div class="stat-value" style="color: var(--warning-color);" id="stat-withdraws">-- ETB</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Active Game ID</div>
            <div class="stat-value" style="color: var(--accent-color);" id="stat-game">--</div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('games')">🎮 Game Engine</button>
        <button class="tab-btn" onclick="switchTab('payouts')">💰 Cashouts</button>
        <button class="tab-btn" onclick="switchTab('users')">👥 Players</button>
    </div>

    <!-- Tab 1: Game Engine Controls -->
    <div id="tab-games" class="tab-content active">
        <div class="panel">
            <div class="panel-title">Active Game Round Controls</div>
            <p style="font-size: 0.85rem; color: var(--text-sub);">Manually force start the current round or adjust the draw timer.</p>
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button class="btn btn-accent" onclick="triggerGameStart()">▶ Force Start Game</button>
                <button class="btn btn-danger" onclick="cancelActiveGame()">🛑 Cancel Round</button>
            </div>
        </div>
    </div>

    <!-- Tab 2: Withdrawals / Payouts -->
    <div id="tab-payouts" class="tab-content">
        <div class="panel">
            <div class="panel-title">Pending Payout Requests</div>
            <div id="withdraw-list">
                <p style="color: var(--text-sub); font-size: 0.85rem;">No pending cashouts.</p>
            </div>
        </div>
    </div>

    <!-- Tab 3: User Management -->
    <div id="tab-users" class="tab-content">
        <div class="panel">
            <div class="panel-title">Quick Adjust Balance</div>
            <input type="text" id="user-id-input" placeholder="Telegram User ID" style="width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: none; background: #0f172a; color: #fff;">
            <input type="number" id="amount-input" placeholder="Amount (ETB)" style="width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: none; background: #0f172a; color: #fff;">
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-success" style="flex:1;" onclick="adjustBalance('add')">+ Add Credits</button>
                <button class="btn btn-danger" style="flex:1;" onclick="adjustBalance('deduct')">- Deduct</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // Fetch Dashboard Stats via API
        async function loadAdminData() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                
                document.getElementById('stat-users').innerText = data.total_users || 0;
                document.getElementById('stat-deposits').innerText = (data.total_deposits || 0) + ' ETB';
                document.getElementById('stat-withdraws').innerText = (data.pending_withdrawals || 0) + ' ETB';
                document.getElementById('stat-game').innerText = data.active_game_id ? '#' + data.active_game_id : 'Idle';
            } catch (err) {
                console.error("Failed loading stats:", err);
            }
        }

        // Initialize on load
        loadAdminData();
        setInterval(loadAdminData, 10000); // Auto refresh stats every 10 sec
    </script>
</body>
</html>
