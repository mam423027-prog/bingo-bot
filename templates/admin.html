<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagere Bingo Admin Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #fff; padding: 16px; margin: 0; }
        h1 { color: #f59e0b; font-size: 1.3rem; text-align: center; }
        .card { background: #161f32; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .val { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        .btn { background: #22c55e; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>👑 Admin Control Panel</h1>
    <div class="card">
        <div>Total Players</div>
        <div class="val" id="stat-users">...</div>
    </div>
    <div class="card">
        <div>Total Deposits</div>
        <div class="val" id="stat-deposits">... ETB</div>
    </div>
    <div class="card">
        <div>Active Round</div>
        <div class="val" id="stat-round">...</div>
    </div>
    <div class="card">
        <div>Prize Pool</div>
        <div class="val" id="stat-pool">... ETB</div>
    </div>
    <button class="btn" onclick="startDraw()">▶ Start Next Draw & Broadcast</button>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/stats', { headers: { 'X-Telegram-Init-Data': window.Telegram?.WebApp?.initData || '' } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Administrator access denied');
                document.getElementById('stat-users').innerText = data.total_users;
                document.getElementById('stat-deposits').innerText = data.total_deposits.toLocaleString() + " ETB";
                document.getElementById('stat-round').innerText = "#" + data.active_game_id;
                document.getElementById('stat-pool').innerText = data.prize_pool.toLocaleString() + " ETB";
            } catch (e) { document.getElementById('stat-users').innerText = e.message || 'Access denied'; }
        }

        async function startDraw() {
            if (confirm("Start draw and broadcast new number?")) {
                const res = await fetch('/api/admin/start-draw', { method: 'POST', headers: { 'X-Telegram-Init-Data': window.Telegram?.WebApp?.initData || '' } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Draw failed');
                alert(data.message);
                fetchStats();
            }
        }

        fetchStats();
    </script>
</body>
</html>
