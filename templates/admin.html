<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagere Bingo Admin Control Center</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161f32;
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #38bdf8;
            --gold-glow: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        h2 { color: var(--gold-glow); margin-bottom: 4px; }
        .subtitle { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px; }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
        }
        .kpi-title { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; }
        .kpi-val { font-size: 1.25rem; font-weight: 800; color: #fff; margin-top: 4px; }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 10px; color: var(--accent-glow); }
        
        button {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #000;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h2>👑 Hagere Bingo Admin</h2>
    <div class="subtitle">Platform Control & Verification Center</div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Total Users</div>
            <div class="kpi-val" id="stat-users">...</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Active Round</div>
            <div class="kpi-val" id="stat-game" style="color:var(--accent-glow);">...</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Prize Pool (ETB)</div>
            <div class="kpi-val" id="stat-pool" style="color:var(--success);">...</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Pending Cashouts</div>
            <div class="kpi-val" id="stat-withdrawals" style="color:var(--gold-glow);">...</div>
        </div>
    </div>

    <div class="section-box">
        <div class="section-title">⚡ Game Engine Controls</div>
        <button onclick="triggerDraw()">🚀 Trigger New Game Draw</button>
        <button style="background:linear-gradient(135deg, #ef4444, #dc2626); color:#fff;" onclick="alert('Current round locked.')">⚠️ Lock Active Round</button>
    </div>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/stats');
                const data = await res.json();
                document.getElementById('stat-users').innerText = data.total_users;
                document.getElementById('stat-game').innerText = "#" + data.active_game_id;
                document.getElementById('stat-pool').innerText = data.prize_pool.toLocaleString() + " ETB";
                document.getElementById('stat-withdrawals').innerText = data.pending_withdrawals + " ETB";
            } catch (e) {
                console.error("Failed to load stats", e);
            }
        }

        async function triggerDraw() {
            if (!confirm("Are you sure you want to draw numbers and start the next round?")) return;
            try {
                const res = await fetch('/api/admin/start-draw', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                fetchStats();
            } catch (e) {
                alert("Failed to execute game draw.");
            }
        }

        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
