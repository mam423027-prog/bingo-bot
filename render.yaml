services:
  - type: web
    name: bingo-bot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: "349952871"
      - key: TELEBIRR_ACCOUNT
        sync: false
      - key: CBEBIRR_ACCOUNT
        sync: false
      - key: DATABASE_PATH
        value: /var/data/bingo.db
    disk:
      name: bingo-data
      mountPath: /var/data
      sizeGB: 1
